<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Radiographer Duty Roster</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{--bg:#0b1a14;--card:#12261d;--in:#0a1511;--bd:#1f3b2e;--fg:#e8f3ec;--mut:#8fa89a;--ac:#1a8754;--rd:#e5484d;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:light){:root{--bg:#f1f6f3;--card:#fff;--in:#eef4f0;--bd:#cfe0d6;--fg:#10261a;--mut:#5d776a;color-scheme:light}}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif}
.w{max-width:560px;margin:0 auto;padding:18px 14px 40px}
.hd{display:flex;gap:14px;align-items:center;margin-bottom:18px}.hd img{width:64px;height:64px;border-radius:16px}
.hd h1{font-size:21px;margin:0}.hd p{margin:2px 0 0;color:var(--mut)}
details,.box{background:var(--card);border:1px solid var(--bd);border-radius:20px;margin-bottom:14px}
summary{padding:16px 18px;font-weight:600;font-size:18px;cursor:pointer}details>div{padding:0 18px 16px}
.box{padding:14px}
input{background:var(--in);color:var(--fg);border:1px solid var(--bd);border-radius:12px;padding:11px 12px;font:inherit;width:100%;margin:4px 0 8px}
.tabs{display:flex;border:1px solid var(--bd);border-radius:14px;overflow:hidden;margin-bottom:14px}
.tabs button{flex:1;padding:13px;background:none;border:0;color:var(--fg);font:inherit;font-weight:600}.tabs .on{background:var(--ac);color:#fff}
.per{font-size:19px;font-weight:700;margin:6px 0 12px}
.nav{display:flex;border:1px solid var(--bd);border-radius:14px;margin-bottom:12px}.nav button{flex:1;background:none;border:0;color:var(--fg);font:inherit;padding:13px}
.dr{display:flex;gap:8px;align-items:center;color:var(--mut);margin-bottom:12px}.dr input{margin:0;flex:1;min-width:0}
.bt{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.bt button{flex:1 1 28%;padding:13px 6px;border-radius:14px;border:1px solid var(--bd);background:none;color:var(--fg);font:inherit;font-weight:600}
.bt .g{background:var(--ac);border-color:var(--ac);color:#fff}.bt .r{color:var(--rd)}
.av{width:54px;height:54px;border-radius:50%;background:#b9bdf5;color:#232a7a;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:19px;flex:none}
.st{display:flex;gap:14px;align-items:center;margin-bottom:12px}.st b{font-size:20px}.st span{color:var(--mut);display:block}
.cs{display:grid;grid-template-columns:repeat(7,1fr);gap:6px 4px;text-align:center}
.cs small{color:var(--mut);display:block;line-height:1.2;margin-bottom:4px;font-size:13px}
.c{aspect-ratio:1;width:100%;border-radius:50%;border:0;font:700 14px system-ui;display:flex;align-items:center;justify-content:center}
table{width:100%;border-collapse:collapse}td,th{padding:9px 6px;border-bottom:1px solid var(--bd);text-align:left;font-size:15px}th{color:var(--mut);font-weight:600;font-size:13px}
.p{display:inline-block;min-width:46px;text-align:center;padding:3px 9px;border-radius:99px;font-weight:700;font-size:13px}
.lg{display:flex;gap:10px;align-items:center;margin:8px 0}
#pr{display:none}
@media print{body>.w{display:none}#pr{display:block;color:#000;background:#fff;padding:20px}#pr td,#pr th{color:#000;border-color:#bbb}}
</style></head><body>
